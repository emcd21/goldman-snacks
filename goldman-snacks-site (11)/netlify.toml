# Goldman Snacks on Netlify
# The site is plain files, so there is no build command. The tutor's server function lives in netlify/functions.
[build]
  publish = "."
  functions = "netlify/functions"

# Keep the server code and settings out of the public site.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
