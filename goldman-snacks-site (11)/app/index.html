<script>
// Installed app: offline cache (sw.js), persistent storage, and the standalone class for the status-bar band.
(() => {
  if (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
  const st = navigator.storage;
  if (st && st.persist) (st.persisted ? st.persisted() : Promise.resolve(false)).then(p => p || st.persist()).catch(() => { });
})();
</script>
